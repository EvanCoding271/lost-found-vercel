
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b2b">
  <title>Email Verification | Lost & Found</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f4;
      color: #18251e;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 40px 28px;
      text-align: center;
      background: white;
      border: 1px solid #e0e8e2;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(18, 59, 43, 0.08);
    }

    .logo {
      width: 66px;
      height: 66px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e3f3e8;
      color: #17633f;
      font-size: 30px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 27px;
    }

    p {
      margin: 0 auto 24px;
      color: #647067;
      font-size: 15px;
      line-height: 1.7;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      background: #17633f;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .button:hover { background: #104b2e; }

    .secondary {
      display: inline-block;
      margin-top: 20px;
      color: #17633f;
      text-decoration: none;
      font-size: 14px;
    }

    .notice {
      display: none;
      margin-bottom: 22px;
      padding: 12px;
      border-radius: 9px;
      background: #fff0ed;
      color: #9b3025;
      font-size: 14px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 28px;
      margin-bottom: 0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" id="statusIcon" aria-hidden="true">✉</div>

    <h1 id="heading">Checking your email link…</h1>

    <p id="message" aria-live="polite">
      Please wait while we check the confirmation result.
    </p>

    <div class="notice" id="errorNotice" role="alert"></div>

    <a class="button" id="continueButton" href="/" hidden>
      Continue to Lost &amp; Found
    </a>

    <a class="secondary" href="/">Back to homepage</a>

    <p class="footer">Lost &amp; Found · Student Community</p>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const heading = document.getElementById("heading");
      const message = document.getElementById("message");
      const icon = document.getElementById("statusIcon");
      const notice = document.getElementById("errorNotice");
      const button = document.getElementById("continueButton");

      const error = params.get("error");
      const description = params.get("error_description");

      if (error || description) {
        heading.textContent = "Verification unsuccessful";
        message.textContent =
          "We couldn't complete email verification. The link may have expired or already been used.";
        icon.textContent = "!";
        notice.textContent = description
          ? description.replace(/\+/g, " ")
          : "Please request a new confirmation email and try again.";
        notice.style.display = "block";
        button.hidden = true;
        return;
      }

      heading.textContent = "Email link opened";
      message.textContent =
        "If you arrived here by clicking the confirmation link in your email, " +
        "Supabase should have completed verification before redirecting you. " +
        "You can now try logging in.";

      icon.textContent = "✓";
      button.hidden = false;
    })();
  </script>
</body>
</html>
